<title>Irodori-TTS Client App のセットアップ</title>
<style>
  /* 本体（theme.css）と同じ言い回しで組む。
     純黒の地、金は塗らずに線で使う、角は落とさない、字は夜永オールド明朝。
     起動の最初に一度だけ出る画面なので theme.css は読み込まず、
     必要な値だけここに持たせている。 */
  @font-face {
    font-family:"Yonaga";
    src:url("assets/YonagaOldMincho-Bold.woff2") format("woff2");
    font-weight:400 700; font-display:swap;
  }

  :root {
    color-scheme:dark;
    --l0:#000000;
    --text:#e9ecf2; --muted:#959daf; --faint:#5c6478;
    --line:#21252e;
    --gold:#c9a86a; --gold-dim:rgba(201,168,106,.34);
  }

  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }

  body {
    font-family:"Yonaga","Segoe UI","Yu Gothic UI",serif;
    font-size:13.5px; line-height:1.6; color:var(--text);
    height:100vh; overflow:hidden; -webkit-font-smoothing:antialiased;
    /* 本体と同じ、左上と右下のごく薄い光 */
    background:
      radial-gradient(1100px 700px at 8% -10%, rgba(201,168,106,.02), transparent 60%),
      radial-gradient(900px 600px at 100% 108%, rgba(107,181,200,.016), transparent 62%),
      var(--l0);
    display:flex; flex-direction:column;
  }

  /* ══ ヘッダ ══ 本体の .hdr と同じ作り */
  .hdr {
    display:flex; align-items:center; gap:9px;
    height:52px; padding:0 18px; flex-shrink:0;
    background:linear-gradient(180deg, rgba(255,255,255,.016), transparent), var(--l0);
    border-bottom:1px solid var(--line); position:relative;
  }
  .hdr::after {
    content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px;
    background:linear-gradient(90deg,transparent,var(--gold-dim) 12%,var(--gold-dim) 88%,transparent);
  }
  .hdr .mk { width:26px; height:26px; display:block; }
  .hdr .wm { height:27px; display:block; opacity:.92; }

  main { flex:1; padding:24px 30px 0; min-height:0; }

  h1 { font-size:17px; font-weight:400; letter-spacing:.12em; margin-bottom:18px; }

  /* ══ 四芒星の区切り ══ 本体の .rule と同じ */
  .rule { display:flex; align-items:center; gap:10px; padding:2px 0 6px; opacity:.55; }
  .rule::before, .rule::after {
    content:""; flex:1; height:1px;
    background:linear-gradient(90deg,transparent,var(--gold-dim) 22%,var(--gold-dim) 78%,transparent);
  }
  .rule i {
    width:11px; height:11px; flex-shrink:0; background:var(--gold);
    clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);
    filter:drop-shadow(0 0 5px var(--gold-dim));
  }

  /* ══ 工程 ══ 角は落とさない。済みは金の細線、これからは沈める */
  .steps { list-style:none; margin:2px 0 16px; }
  .steps li {
    display:flex; align-items:center; gap:13px;
    padding:6px 0; color:var(--faint); transition:color .3s;
  }
  .steps li .mark {
    width:22px; height:22px; flex:0 0 22px;
    border:1px solid var(--line);
    display:grid; place-items:center;
    font-size:11px; color:var(--faint);
    transition:border-color .3s, color .3s;
  }
  .steps li.doing { color:var(--text); }
  .steps li.doing .mark { border-color:var(--gold); color:var(--gold); }
  .steps li.done { color:var(--muted); }
  .steps li.done .mark { border-color:var(--gold-dim); color:var(--gold-dim); }

  /* ══ 進み具合 ══ 面ではなく細い線で見せる */
  .bar { height:2px; background:var(--line); }
  .bar i { display:block; height:100%; width:0; background:var(--gold); transition:width .4s; }

  #detail {
    margin-top:12px; height:4.2em; overflow:hidden;
    font-family:"Cascadia Mono",Consolas,monospace;
    font-size:11px; line-height:1.5; color:var(--faint);
    white-space:pre-wrap; word-break:break-all;
  }

  footer { flex-shrink:0; padding:0 30px 22px; color:var(--faint); font-size:12px; }

  /* ══ 取得するモデルを選ぶ ══ 設定画面の表と同じ並び */
  #choose { display:none; flex:1; min-height:0; padding:20px 30px 18px; flex-direction:column; }
  body.choosing #choose { display:flex; }
  body.choosing #progress, body.choosing footer { display:none; }
  .pc { display:inline-flex; gap:14px; padding:5px 11px; border:1px solid var(--gold-dim); margin-bottom:10px; font-size:12.5px; align-self:flex-start; }
  .pc b, .sum b { color:var(--gold); font-weight:400; font-variant-numeric:tabular-nums; }
  .tbl { flex:1; min-height:0; overflow-y:auto; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th { text-align:left; font-weight:400; color:var(--faint); font-size:11px; padding:5px 7px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:6px 7px; border-bottom:1px solid var(--line); }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  tr.group td { color:var(--faint); font-size:11px; padding-top:10px; border-bottom:none; }
  tr.dis td { color:var(--faint); }
  td .note { color:var(--muted); font-size:12px; }
  .over { color:var(--gold); }
  .have { color:var(--muted); font-size:11.5px; }
  input[type=checkbox] { accent-color:var(--gold); width:15px; height:15px; vertical-align:middle; }
  .sum { margin-top:10px; font-size:12.5px; color:var(--muted); }
  .hint { margin-top:6px; font-size:12.5px; }
  .go { align-self:flex-end; margin-top:10px; background:none; border:1px solid var(--gold); color:var(--gold); padding:7px 18px; font:inherit; cursor:pointer; }
  .go:disabled { border-color:var(--line); color:var(--faint); cursor:default; }

  .err {
    margin:14px 30px 0; padding:11px 13px; display:none;
    background:rgba(208,102,102,.06); border:1px solid rgba(208,102,102,.45);
    color:#d79a9a; font-size:12px; white-space:pre-wrap;
  }
</style>

<div class="hdr">
  <img class="mk" src="assets/mark.png" alt="">
  <img class="wm" src="assets/logo.png" alt="Irodori-TTS">
</div>

<section id="choose">
  <h1>取得する音声モデルを選んでください</h1>
  <div class="pc">この PC の GPU：<b id="gpu-name">—</b>　VRAM：<b id="gpu-vram">—</b></div>
  <div class="tbl"><table id="models"></table></div>
  <div class="sum">取得する容量：<b id="total">—</b></div>
  <p class="hint">分からなければ、このまま進んで大丈夫です。あとから設定（右上の歯車）で足したり消したりできます。</p>
  <button id="go" class="go">この内容で準備を始める</button>
</section>

<main id="progress">
  <h1>はじめの準備をしています</h1>

  <ul class="steps">
    <li id="s1"><span class="mark">1</span><span>ランタイムを用意する</span></li>
    <li id="s2"><span class="mark">2</span><span>ライブラリを入れる</span></li>
    <li id="s3"><span class="mark">3</span><span>音声モデルを取得する</span></li>
  </ul>

  <div class="rule"><i></i></div>

  <div class="bar"><i id="bar"></i></div>
  <div id="detail"></div>
</main>

<div id="err" class="err"></div>

<footer>
  回線の速さにもよりますが、30分から1時間ほどかかります。<br>
  途中で閉じても、次に開いたときに続きからやり直します。
</footer>

<script>
  const els = [null, document.getElementById('s1'), document.getElementById('s2'), document.getElementById('s3')];
  const bar = document.getElementById('bar');
  const detail = document.getElementById('detail');
  const err = document.getElementById('err');

  window.irodoriSetup.onProgress((p) => {
    // 済んだ工程は飛ばされることもある（モデルが既にあるなど）。
    // 最後の合図では、工程名を書き換えずに全部を済みにする。
    if (p.final) {
      for (let i = 1; i <= 3; i++) els[i].className = 'done';
      bar.style.width = '100%';
      detail.textContent = p.detail || '';
      return;
    }
    for (let i = 1; i <= 3; i++) {
      els[i].className = i < p.index ? 'done' : i === p.index ? 'doing' : '';
    }
    bar.style.width = `${Math.round(((p.index - 1) / p.total) * 100)}%`;
    els[p.index].lastElementChild.textContent = p.step;
    if (p.detail !== undefined) detail.textContent = p.detail;
  });

  // 取得するモデルを選ぶ。一覧は model_catalog.py から来る（設定画面の表と同じ中身）。
  window.irodoriSetup.onChooseModels((c) => {
    const gpu = c.gpu || {};
    document.getElementById('gpu-name').textContent = gpu.name || 'GPU なし';
    document.getElementById('gpu-vram').textContent = gpu.vram_gb ? `${gpu.vram_gb}GB` : '—';
    let h = '<tr><th>取得</th><th>モデル</th><th class="num">容量</th><th class="num">生成時の VRAM</th></tr>';
    let group = '';
    // 前の版から上げた人（もう何か持っている人）には、新しいモデルを勝手に足さない。
    const fresh = !c.models.some((m) => m.downloaded);
    for (const m of c.models) {
      if (m.group !== group) { group = m.group; h += `<tr class="group"><td></td><td colspan="3">${group}</td></tr>`; }
      let vram;
      if (!m.runnable) vram = 'この GPU では動きません';
      else if (m.vram_gb == null) vram = '—';
      else {
        const over = gpu.vram_gb && m.vram_gb > gpu.vram_gb;
        vram = `<span class="${over ? 'over' : ''}">${m.vram_gb.toFixed(1)}GB${over ? ' ⚠ 足りません' : ''}</span>`;
      }
      // 取得済みのものは外せない（ここは足す画面。消すのは設定画面）。
      const checked = m.downloaded || (fresh && m.default && m.runnable);
      const box = `<input type="checkbox" value="${m.id}" data-gb="${m.downloaded ? 0 : m.size_gb}" ${checked ? 'checked' : ''} ${m.runnable && !m.downloaded ? '' : 'disabled'}>`;
      h += `<tr class="${m.runnable ? '' : 'dis'}"><td>${box}</td><td>${m.label}<span class="note">（${m.note}）</span>${m.downloaded ? ' <span class="have">取得済み</span>' : ''}</td>`
         + `<td class="num">${m.size_gb.toFixed(1)}GB</td><td class="num">${vram}</td></tr>`;
    }
    const table = document.getElementById('models');
    table.innerHTML = h;
    const boxes = () => [...table.querySelectorAll('input[type=checkbox]')];
    const allHave = !fresh;
    const refresh = () => {
      const picked = boxes().filter((b) => b.checked);
      const gb = picked.reduce((s, b) => s + Number(b.dataset.gb), 0);
      document.getElementById('total').textContent = `約${Math.round(gb + (allHave ? 0 : c.common_gb))}GB`
        + (allHave ? '' : `（共通の部品 約${Math.round(c.common_gb)}GB を含む）`);
      document.getElementById('go').disabled = picked.length === 0;
    };
    table.addEventListener('change', refresh);
    refresh();
    document.body.classList.add('choosing');
    document.getElementById('go').onclick = () => {
      document.body.classList.remove('choosing');
      window.irodoriSetup.sendChosenModels(boxes().filter((b) => b.checked).map((b) => b.value));
    };
  });

  window.irodoriSetup.onError((message) => {
    err.style.display = 'block';
    err.textContent = message;
  });
</script>
