# LoRA fine-tuning configuration for Irodori-TTS-v4-Large（Client 独自、ベータ）。
#
# 上流は v4-Large の LoRA 用 config をまだ出していない（2026-09-29 時点）。
# model: は公開チェックポイントに埋め込まれた config_json の写し。ただし ModelConfig に無い
# 項目（max_text_len・max_caption_len・ref_max_seconds。学習側の値）は除いた。train: に同じ値がある。
# 形が1つでも食い違うと重みを読み込めないので、手で写さない。
# train: は train_v4_small_lora.yaml と同じ。勾配チェックポイントだけ足した。

model:
  flow_parameterization: rf_velocity
  latent_dim: 32
  latent_patch_size: 1
  model_dim: 2048
  num_layers: 24
  num_heads: 32
  mlp_ratio: 2.875
  text_mlp_ratio: 2.6
  speaker_mlp_ratio: 2.6
  dropout: 0.0
  text_vocab_size: 262144
  text_tokenizer_repo: google/t5gemma-2-1b-1b
  text_encoder_revision: dd0a2683227859151b1730ca3a63087df5b5f39b
  text_add_bos: true
  text_encoder_type: pretrained
  pretrained_projector_type: residual_mlp
  pretrained_projector_hidden_ratio: 2.0
  pretrained_projector_dropout: 0.0
  text_dim: 1280
  text_layers: 14
  text_heads: 10
  use_caption_condition: true
  use_speaker_condition: true
  caption_vocab_size: 262144
  caption_tokenizer_repo: google/t5gemma-2-1b-1b
  caption_add_bos: true
  caption_dim: 1280
  caption_layers: 
  caption_heads: 
  caption_mlp_ratio: 
  speaker_dim: 1280
  speaker_layers: 14
  speaker_heads: 20
  speaker_patch_size: 4
  timestep_embed_dim: 512
  adaln_rank: 256
  norm_eps: 0.00001   # 1e-05 と書くと YAML は文字列として読む（学習が落ちた）
  use_duration_predictor: true
  duration_aux_dim: 14
  duration_hidden_dim: 1280
  duration_layers: 4
  duration_dropout: 0.1
  duration_attention_heads: 20
  duration_architecture: token_sum_dual_adarn_zero_no_aux
  duration_token_init_frames: 9.0
  duration_speaker_fusion: adarn_zero
  duration_caption_fusion: adarn_zero
  duration_caption_pooling: masked_mean

train:
  train_mode: rf
  batch_size: 40
  gradient_accumulation_steps: 2
  num_workers: 16
  # 上流は v4 の2ファイルだけ false だが、他14ファイルは true。LoRA ジョブは
  # 1エポックが数バッチしかなく、false だとエポックの切れ目ごとに全ワーカーが
  # 破棄される。Windows は spawn なので起動のたびに torch を import し直し、
  # GPU が待ちに入る（実測 36.5秒/step → 3.3秒/step）。他の config に揃える。
  dataloader_persistent_workers: true
  dataloader_prefetch_factor: 4
  dataloader_cuda_prefetch: true
  length_bucket_enabled: true
  length_bucket_window_batches: 64
  latent_length_bucket_size: 0
  allow_tf32: true
  compile_model: false
  # 3.29B は勾配を全部持つと 16GB に載らない。全体学習の設定（train_v4_large.yaml）と同じく
  # 勾配チェックポイントを使い、3 ブロックに 1 つだけ中間を持つ
  gradient_checkpointing: true
  gradient_checkpointing_store_every: 3
  precision: bf16
  optimizer: adamw
  learning_rate: 0.0001
  pretrained_text_encoder_learning_rate: 0.00001
  weight_decay: 0.01
  lr_scheduler: wsd
  warmup_steps: 1000
  stable_steps: 24000
  min_lr_scale: 0.01
  max_steps: 30000
  max_text_len: 256
  max_caption_len: 512
  text_condition_dropout: 0.1
  speaker_condition_dropout: 0.1
  caption_condition_dropout: 0.1
  timestep_stratified: true
  max_latent_steps: 750
  ref_min_seconds: 1.0
  ref_max_seconds: 120.0
  fixed_target_latent_steps:
  fixed_target_full_mask: false
  rf_loss_mode: utterance_mean
  duration_loss_weight: 1.0
  duration_backprop_to_condition: false
  duration_speaker_dropout: 0.1
  duration_caption_dropout: 0.1
  duration_huber_delta: 0.1
  log_every: 100
  save_every: 1000
  checkpoint_best_n: 5
  wandb_enabled: false
  wandb_project:
  wandb_entity:
  wandb_run_name:
  wandb_mode: online
  ddp_find_unused_parameters: false
  valid_ratio: 0.0005
  valid_every: 1000
  lora_enabled: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  lora_bias: none
  lora_target_modules: diffusion_attn
  lora_modules_to_save: auto
  # 固定の元の重みを bf16 で持つ（Client 独自）。fp32 では 16GB に載らなかった
  lora_frozen_base_bf16: true
  # 文章の読み取り部分（T5Gemma）の結果を先に計算して使い回し、GPU から降ろす（Client 独自）
  lora_cache_condition_states: true
  seed: 0
